<svg viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ag1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="ag2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="32" fill="#110e00"/>
  <rect x="50" y="50" width="500" height="700" rx="24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <g opacity="0.8">
    <circle cx="300" cy="350" r="180" fill="none" stroke="url(#ag1)" stroke-width="0.5" stroke-dasharray="4 8"/>
    <circle cx="300" cy="350" r="120" fill="none" stroke="url(#ag1)" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.6"/>
    <circle cx="300" cy="350" r="70" fill="url(#ag1)" opacity="0.08"/>
    <circle cx="300" cy="350" r="70" fill="none" stroke="url(#ag1)" stroke-width="1" opacity="0.3"/>
  </g>

  <g opacity="0.4">
    <circle cx="150" cy="180" r="6" fill="#facc15"/>
    <circle cx="450" cy="520" r="5" fill="#eab308"/>
    <circle cx="430" cy="160" r="4" fill="#facc15"/>
    <circle cx="170" cy="550" r="5" fill="#eab308"/>
    <circle cx="140" cy="400" r="3" fill="#fde047"/>
    <circle cx="460" cy="300" r="3" fill="#facc15"/>
  </g>

  <line x1="150" y1="180" x2="300" y2="350" stroke="#facc15" stroke-width="0.5" opacity="0.15"/>
  <line x1="450" y1="520" x2="300" y2="350" stroke="#eab308" stroke-width="0.5" opacity="0.15"/>
  <line x1="430" y1="160" x2="300" y2="350" stroke="#facc15" stroke-width="0.5" opacity="0.1"/>
  <line x1="170" y1="550" x2="300" y2="350" stroke="#eab308" stroke-width="0.5" opacity="0.1"/>

  <rect x="160" y="520" width="280" height="44" rx="12" fill="#facc15" opacity="0.85"/>
  <rect x="200" y="585" width="200" height="2" rx="1" fill="url(#ag2)" opacity="0.3"/>

  <g transform="translate(300,350)">
    <circle cx="-50" cy="-50" r="3" fill="#facc15" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="50" r="3" fill="#eab308" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-60" cy="40" r="2.5" fill="#fde047" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="-45" r="2.5" fill="#facc15" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
