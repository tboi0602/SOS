services:
  # ─── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─── API Server ───────────────────────────────────────
  server:
    build:
      context: ./TTL-Server
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    image: ${DOCKER_USER}/ttl-server:${IMAGE_TAG:-latest}
    profiles: []
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.docker
    expose:
      - "4000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─── Website (Next.js) ────────────────────────────────
  website:
    build:
      context: ./TTL-Website
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: ${DOCKER_USER}/ttl-website:${IMAGE_TAG:-latest}
    profiles: []
    expose:
      - "3000"
    depends_on:
      - server
    env_file: .env.docker
    environment:
      PORT: 3000
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─── Nginx (Production only) ──────────────────────────
  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - website
      - server
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ─── Certbot (Production only, auto-renew) ────────────
  certbot:
    image: certbot/certbot
    profiles: ["prod"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $$!;
      done'
    networks:
      - app_network

  # ─── Database Backup (Production only) ─────────────────
  db-backup:
    image: postgres:16-alpine
    profiles: ["prod"]
    env_file: .env.docker
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        apk add --no-cache bash;
        while :; do
          bash /backup-db.sh;
          sleep 86400;
        done
      '
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  uploads_data:
  certbot_www:
  certbot_conf:
  db_backups:

networks:
  app_network:
    driver: bridge
